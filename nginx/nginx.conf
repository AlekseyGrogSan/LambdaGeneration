server {
    listen 80;
    server_name localhost;

    # 1. Проксирование API и Swagger на сервис 'app'
    location ~ ^/(api|swagger|openapi) {
        proxy_pass http://app:8080; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 2. Подача статических файлов фронтенда
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Важно для React Router: при запросе /posts, 
        # NGINX вернет index.html, а роутер React обработает путь.
        try_files $uri $uri/ /index.html; 
    }
}