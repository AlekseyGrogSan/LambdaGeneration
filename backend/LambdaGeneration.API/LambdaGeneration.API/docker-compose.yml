﻿services:
  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_DB: "db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "123"  
    volumes:
      - postgres-data:/var/lib/postgresql/data  # Для 16 версии оставляем старый путь
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres-data: