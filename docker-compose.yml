version: '3.8'

services:
  # 1. СЕРВИС БАЗЫ ДАННЫХ
  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. СЕРВИС ASP.NET ПРИЛОЖЕНИЯ (API)
  app:
    container_name: app
    build:
      context: .
      dockerfile: ./backend/LambdaGeneration.API/LambdaGeneration.API/Dockerfile
    # Порт 8080 не открыт наружу, доступ только через Nginx
    environment:
      ASPNETCORE_ENVIRONMENT: "Production" # ✅ Production
      ASPNETCORE_URLS: "http://+:8080"
      
      # ✅ ИСПРАВЛЕНО: Используется переменная из .env
      ConnectionStrings__LambdaGenerationDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      
      # Переменные из .env
      JwtOptions__SecretKey: ${JWT_SECRET}
      AdminConfig__Email: ${ADMIN_EMAIL}
      AdminConfig__Password: ${ADMIN_PASSWORD}
      EmailSettings__Username: ${EMAIL_USERNAME}
      EmailSettings__Password: ${EMAIL_PASSWORD}
      GigaChat__ClientId: ${GIGACHAT_CLIENT_ID}
      GigaChat__ClientSecret: ${GIGACHAT_CLIENT_SECRET}
      ClientUrl: ${CLIENT_URL}

    depends_on:
      postgres:
        condition: service_healthy
    restart: always # ✅ Always

  # 3. СЕРВИС ФРОНТЕНДА (React Build + Nginx)
  frontend:
    container_name: frontend
    build:
      # Проверьте, что это правильный путь к папке фронтенда
      context: ./frontend 
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80" # Фронтенд доступен на порту 80 сервера
    volumes:
      # Монтируем конфиг NGINX
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: always # ✅ Always

volumes:
  postgres-data: